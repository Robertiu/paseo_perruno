name: paseo_perruno
description: Diario gamificado de paseos de perros (Redis en la nube) con foto, dictado por voz y GPS.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Base de datos NoSQL en la nube (Redis) vía la API del backend
  http: ^1.2.2
  shared_preferences: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.5

  # Gadget 1: multimedia (cámara y galería)
  image_picker: ^1.1.2

  # Gadget 2: audio y dictado (voz a texto)
  speech_to_text: ^7.0.0

  # Gadget 3: geolocalización y mapas
  geolocator: ^13.0.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.1

  # Utilidades
  intl: ^0.19.0

  material_ui: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Fredoka
      fonts:
        - asset: assets/fonts/Fredoka.ttf
